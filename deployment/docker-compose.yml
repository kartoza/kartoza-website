version: '3.8'

services:
  # Hugo + Nginx - Build and serve the static site
  website:
    build:
      context: ..
      dockerfile: deployment/docker/Dockerfile
    container_name: kartoza-website
    environment:
      - BASE_URL=${BASE_URL:-/}
      - GATEWAY_ERPNEXT_API_URL=${GATEWAY_ERPNEXT_API_URL:-https://api.do.kartoza.com/erpnext/kartoza-website/api/resource/Lead}
      - GATEWAY_ERPNEXT_ISSUE_API_URL=${GATEWAY_ERPNEXT_ISSUE_API_URL:-https://api.do.kartoza.com/erpnext/kartoza-website/api/method/kartoza_custom.api.create_support_ticket}
      - ERPNEXT_API_KEY=${ERPNEXT_API_KEY}
      - ERPNEXT_API_SECRET=${ERPNEXT_API_SECRET}
    ports:
      - "${PORT}:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
