# --------------------------------------------------------------------------
# Product pages -> Solutions
# Old pattern: /product/<service>
# New pattern: /solutions/<service>/
# --------------------------------------------------------------------------
location ~ ^/product/?$                      { return 301 /solutions/; }
location ~ ^/product/software-development/?$ { return 301 /solutions/software-development/; }
location ~ ^/product/consulting/?$           { return 301 /solutions/consultancy/; }
location ~ ^/product/hosting/?$              { return 301 /hosting/; }
location ~ ^/product/maintenance/?$          { return 301 /solutions/gis-support/; }
rewrite ^/product/(.*)$ /solutions/ permanent;

# --------------------------------------------------------------------------
# Section-level redirects (old path -> new path)
# --------------------------------------------------------------------------

# Old news/blog patterns
rewrite ^/news/?$                /blog/ permanent;
rewrite ^/news/(.+?)/?$         /blog/$1/ permanent;

# Old team patterns
rewrite ^/our-team/?$            /the_team/ permanent;
rewrite ^/our-team/(.+?)/?$     /the_team/$1/ permanent;
rewrite ^/team/?$                /the_team/ permanent;
rewrite ^/team/(.+?)/?$         /the_team/$1/ permanent;
rewrite ^/team-members/?$        /the_team/ permanent;
rewrite ^/team-members/(.+?)/?$ /the_team/$1/ permanent;
rewrite ^/people/?$              /the_team/ permanent;
rewrite ^/people/(.+?)/?$       /the_team/$1/ permanent;

# Old services/solutions patterns
rewrite ^/services/?$            /solutions/ permanent;
rewrite ^/services/(.+?)/?$     /solutions/$1/ permanent;

# Old projects/portfolio patterns
rewrite ^/projects/?$            /portfolio/ permanent;
rewrite ^/projects/(.+?)/?$     /portfolio/$1/ permanent;
rewrite ^/case-studies/?$        /portfolio/ permanent;
rewrite ^/case-studies/(.+?)/?$ /portfolio/$1/ permanent;

# Old training patterns
rewrite ^/training/?$            /training-courses/ permanent;
rewrite ^/training/(.+?)/?$     /training-courses/$1/ permanent;
rewrite ^/gis-training/?$        /training-courses/ permanent;
rewrite ^/gis-training/(.+?)/?$ /training-courses/$1/ permanent;
rewrite ^/courses/?$             /training-courses/ permanent;
rewrite ^/courses/(.+?)/?$      /training-courses/$1/ permanent;

# Old company/about patterns
rewrite ^/company/?$             /about/ permanent;
rewrite ^/company/(.+?)/?$      /about/$1/ permanent;

# Old contact patterns
location ~ ^/contact/?$ { return 301 /contact-us/; }

# Old maps/gallery patterns
rewrite ^/maps/?$                /gallery/ permanent;
rewrite ^/maps/(.+?)/?$         /gallery/$1/ permanent;

# Old jobs patterns
rewrite ^/jobs/?$                /careers/ permanent;
rewrite ^/jobs/(.+?)/?$         /careers/$1/ permanent;

# --------------------------------------------------------------------------
# Standalone page redirects
# --------------------------------------------------------------------------

# Landing / welcome pages
location ~ ^/welcome/?$          { return 301 /; }
location ~ ^/lp_new/?$           { return 301 /; }
location ~ ^/test-landing-page/?$ { return 301 /; }

# Support pages
location ~ ^/support-package/?$   { return 301 /solutions/gis-support/; }
location ~ ^/support-solutions/?$ { return 301 /solutions/gis-support/; }

# Apps (old root-level app pages)
location ~ ^/bims/?$              { return 301 /apps/bims/; }
location ~ ^/merginmaps/?$        { return 301 /apps/; }
# Note: /qgis-resources/ now has its own content page - no redirect needed

# E-commerce pages (no longer applicable)
location ~ ^/all-products/?$      { return 301 /solutions/; }
location ~ ^/shop-by-category/?$  { return 301 /solutions/; }

# Old job listing pages at root level
location ~ ^/full-stack-developer/?$                       { return 301 /careers/; }
location ~ ^/qgis-documentation-writer/?$                  { return 301 /careers/; }
location ~ ^/devops-engineer-intermediate-to-senior/?$     { return 301 /careers/; }
location ~ ^/junior-gis-specialist-gisc-technician/?$      { return 301 /careers/; }

# Policy and governance pages now have their own content - no redirects needed
# Pages served directly: /policies/, /privacy-policy/, /cancellation-policy/,
# /conflict-of-interest-policy/, /child-protection-policy/, /complaints-policy/,
# /anti-bribery-and-corruption-policy/, /fraud-policy/, /code-of-conduct/,
# /coding-standards/, /crowdfunding/, /qgis-resources/

# FBIS privacy policy redirects to the main privacy policy
location ~ ^/fbis-privacy-policy/?$ { return 301 /privacy-policy/; }

# --------------------------------------------------------------------------
# ERPNext system paths - redirect to ERP or homepage
# --------------------------------------------------------------------------
location ~ ^/app/issue { return 301 https://erp.kartoza.com$request_uri; }
rewrite ^/app/(.*)$        / permanent;
