[outputFormats]
  [outputFormats.SearchIndex]
    baseName = "search-index"
    mediaType = "application/json"
    isPlainText = true

[outputs]
  home = ["HTML", "RSS", "JSON", "SearchIndex"]

# Hugo dev-server reverse proxy for auth endpoints.
# Only active when running `hugo server` — nginx handles this in production.
# Routes /api/auth/* directly to the ERPNext instance so login/logout/register
# work without needing Docker or nginx running locally.
[[server.routes]]
  pattern = "/api/auth/login"
  to = "https://api.do.kartoza.com/erpnext/kartoza-website/api/method/login"
  status = 200

[[server.routes]]
  pattern = "/api/auth/logout"
  to = "https://api.do.kartoza.com/erpnext/kartoza-website/api/method/logout"
  status = 200

[[server.routes]]
  pattern = "/api/auth/register"
  to = "https://api.do.kartoza.com/erpnext/kartoza-website/api/method/kartoza_custom.api.sign_up"
  status = 200
