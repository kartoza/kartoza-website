# ==========================================================================
# Legacy URL Redirects (301 Permanent)
# Comprehensive mapping from old kartoza.com (ERPNext) to new Hugo site
#
# Usage: Include this file in your nginx server block via:
#   include /path/to/redirects.conf;
#
# Or copy the relevant sections into your existing server config.
#
# All rules handle URLs with or without trailing slashes.
# ==========================================================================

# --------------------------------------------------------------------------
# Blog: Strip category prefix from old URLs
# Old pattern: /blog/<category>/<slug>
# New pattern: /blog/<slug>/
#
# Categories on old site: python, qgis, postgis, docker, database, fossgis,
# education, conference, geoserver, geonode, javascript, leaflet, grass-gis,
# news, hosting, uncategorised, gis, ai, training, remote-sensing,
# data-science, cloud-native-gis, ckan, app, jobs
# --------------------------------------------------------------------------
rewrite ^/blog/python/(.+?)/?$          /blog/$1/ permanent;
rewrite ^/blog/qgis/(.+?)/?$           /blog/$1/ permanent;
rewrite ^/blog/postgis/(.+?)/?$        /blog/$1/ permanent;
rewrite ^/blog/docker/(.+?)/?$         /blog/$1/ permanent;
rewrite ^/blog/database/(.+?)/?$       /blog/$1/ permanent;
rewrite ^/blog/fossgis/(.+?)/?$        /blog/$1/ permanent;
rewrite ^/blog/education/(.+?)/?$      /blog/$1/ permanent;
rewrite ^/blog/conference/(.+?)/?$     /blog/$1/ permanent;
rewrite ^/blog/geoserver/(.+?)/?$      /blog/$1/ permanent;
rewrite ^/blog/geonode/(.+?)/?$        /blog/$1/ permanent;
rewrite ^/blog/javascript/(.+?)/?$     /blog/$1/ permanent;
rewrite ^/blog/leaflet/(.+?)/?$        /blog/$1/ permanent;
rewrite ^/blog/grass-gis/(.+?)/?$      /blog/$1/ permanent;
rewrite ^/blog/news/(.+?)/?$           /blog/$1/ permanent;
rewrite ^/blog/hosting/(.+?)/?$        /blog/$1/ permanent;
rewrite ^/blog/uncategorised/(.+?)/?$  /blog/$1/ permanent;
rewrite ^/blog/gis/(.+?)/?$            /blog/$1/ permanent;
rewrite ^/blog/ai/(.+?)/?$             /blog/$1/ permanent;
rewrite ^/blog/training/(.+?)/?$       /blog/$1/ permanent;
rewrite ^/blog/remote-sensing/(.+?)/?$ /blog/$1/ permanent;
rewrite ^/blog/data-science/(.+?)/?$   /blog/$1/ permanent;
rewrite ^/blog/cloud-native-gis/(.+?)/?$ /blog/$1/ permanent;
rewrite ^/blog/ckan/(.+?)/?$           /blog/$1/ permanent;
rewrite ^/blog/app/(.+?)/?$            /blog/$1/ permanent;
rewrite ^/blog/jobs/(.+?)/?$           /blog/$1/ permanent;

# Blog slug variations (old slug -> new slug where they differ)
rewrite ^/blog/the-evolution-of-gis-from-humble-beginnings-to-modern-tech-/?$ /blog/the-evolution-of-gis-from-humble-beginnings-to-modern-tech/ permanent;
rewrite ^/blog/idsw-2025-my-key-takeaways/?$ /blog/how-ai-tools-are-transforming-developer-workflows-lessons-from-idsw/ permanent;

# Blog category index pages -> blog index
rewrite ^/blog/(python|qgis|postgis|docker|database|fossgis|education|conference|geoserver|geonode|javascript|leaflet|grass-gis|news|hosting|uncategorised|gis|ai|training|remote-sensing|data-science|cloud-native-gis|ckan|app|jobs)/?$ /blog/ permanent;

