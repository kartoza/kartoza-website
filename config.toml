# May be overwritten in .github/workflows/github-pages.yml or other config files
baseURL = 'https://kartoza.com/'
languageCode = 'en-us'
title = 'Kartoza'
theme = 'hugo-bulma-blocks-theme'
# Default pagination.
# Can override this when needed e.g. {{ range (.Paginator 5).Pages }}
[pagination]
  paginate = 50

# See https://mertbakir.gitlab.io/hugo/syntax-highlighting-in-hugo/
pygmentsUseClasses = true
pygmentsCodefences = true


# Folders in these folders get published automatically
staticDir = ['static']

# Enable minification for production builds
[minify]
  disableCSS = false
  disableHTML = false
  disableJS = false
  disableJSON = false
  disableSVG = false
  disableXML = false
  minifyOutput = true
  [minify.tdewolff]
    [minify.tdewolff.html]
      keepWhitespace = false

# See https://gohugo.io/templates/robots/
enableRobotsTXT = true

[taxonomies]
  category = 'categories'
  series = 'series'
  tag = 'tags'
  submenu = 'submenus'

[params]
# ERPNext base URL used when running hugo server locally (no nginx proxy).
# The JS only uses this URL on localhost — on the real domain nginx proxy is used instead.
# Uses the same public gateway as production; requires allow_cors in ERPNext site_config.json.
erpnextBaseUrl = "https://erp.kartoza.com"

# Min hugo version
minHugoVersion = "0.139.0"
description = "Kartoza - Open Source Geospatial Solutions"
# Brand colours (Kartoza branding - extracted from brand pattern)
# Blues
primary1 = "#53a2cc"
primary2 = "#3488b8"
primary3 = "#b2d5e8"
# Greys
primary4 = "#9E9E9E"
primary5 = "#C8C8C8"
# Orange/Gold
primary6 = "#E8A331"
primary1-invert = "#fff"
primary2-invert = "#fff"
primary3-invert = "#fff"
primary4-invert = "#fff"
primary5-invert = "#333"
primary6-invert = "#fff"
links = "#3B9DD9"
complementary1 = "#E8A331"
complementary2 = "#D4922A"
complementary3 = "#F0B84D"
complementary4 = "#9E9E9E"
complementary5 = "#f0f4f7"
complementary6 = "#1B6B9B"
complementary7 = "#E8A331"
complementary8 = "#3B9DD9"
light1 = "#f7f9fb"
light2 = "#e8ecf0"
light3 = "#d4dbe2"
dark1 = "#6B7B8D"
dark2 = "#1a2a3a"
text-primary1 = "#1a2a3a"
text-primary2 = "#4D6370"
# Bulma specific colours based on our branding
black = "#1a2a3a"
white = "#ffffff"
grey-dark = "#3d4f5f"
grey-darker = "#2a3a4a"
grey-light = "#d4dbe2"
primary = "#3B9DD9"
danger = "#E55B3C"
info = "#5BB5E8"
success = "#4CAF50"
warning = "#E8A331"
link = "#3B9DD9"
# Brand fonts
heading-font = "'Nunito', sans-serif"
text-font = "'Nunito', sans-serif"
fancy-font = "'Nunito', sans-serif"

menuFontClass = "is-size-6"
## Gh repo edit link
githubRepo = "https://github.com/kartoza/Kartoza-Hugo/"
githubSubdir = "content"
githubBranch = "main"

## GH Repo for filing a new issue
githubIssueUrl = "https://github.com/kartoza/Kartoza-Hugo/issues/new/choose"
### Edit content repo
githubEditUrl = "https://github.com/kartoza/Kartoza-Hugo/edit/main"
### Radius for boxes (organic rounded)
corner-radius = "12px"

## This will turn on Cookie popup. True to show popup
cookiesstate = false

# Matomo - disabled for now
matomoURL = ""
matomoSiteId = ''

# Allow raw HTML in markdown files
# SECURITY NOTE: This is enabled because content is from trusted Kartoza team members only.
# If accepting user-generated content, set to false to prevent XSS attacks.
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

# Syntax highlighter for code blocks
[markup.highlight]
      codeFences = true
      guessSyntax = true
      hl_Lines = ""
      lineNoStart = 1
      lineNos = false
      lineNumbersInTable = false
      tabWidth = 4
      noClasses = false
      style = "monokai"

[markup.tableOfContents]
      endLevel = 3
      ordered = false
      startLevel = 2

