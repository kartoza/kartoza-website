<script>
// Auth nav state — runs on every page
(function() {
    var AUTH_KEY = 'kartoza_auth';
    var ERP_BASE = '{{ .Site.Params.erpnextBaseUrl | default "" }}';
    var IS_LOCAL = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
    function authLogoutUrl() {
        return (IS_LOCAL && ERP_BASE) ? ERP_BASE + '/api/method/logout' : '/api/auth/logout';
    }

    function getAuth() {
        try { return JSON.parse(localStorage.getItem(AUTH_KEY)); } catch(e) { return null; }
    }

    function clearAuth() { localStorage.removeItem(AUTH_KEY); }

    // Expose updateAuthNav so login page can call it immediately after login
    window.updateAuthNav = function() {
        var auth = getAuth();
        var loginEl = document.getElementById('auth-nav-login');
        var userEl = document.getElementById('auth-nav-user');
        var nameEl = document.getElementById('auth-nav-name-text');

        if (!loginEl || !userEl) return;

        if (auth && auth.loggedIn) {
            loginEl.style.display = 'none';
            userEl.style.display = '';
            if (nameEl) nameEl.textContent = auth.fullName || auth.email || 'Account';
        } else {
            loginEl.style.display = '';
            userEl.style.display = 'none';
        }
    };

    // Run on page load
    updateAuthNav();

    // Logout handler
    document.addEventListener('click', function(e) {
        var logoutLink = e.target.closest('#auth-nav-logout');
        if (!logoutLink) return;
        e.preventDefault();
        fetch(authLogoutUrl(), { method: 'POST', credentials: 'include' }).catch(function(){});
        clearAuth();
        updateAuthNav();
        window.location.href = '/';
    });
})();
</script>
