{{ define "main" }}

{{ partial "page-hero.html" . }}

<section class="article section">
  <div class="container">

    {{ partial "breadcrumb.html" . }}

    <div class="page-with-aside">
      <article class="article__main">

        {{ partial "page-meta.html" . }}

        {{ with .Params.featured_image | default .Params.image }}
          <figure class="frame frame--wide u-mb-7">
            <img src="{{ . | absURL }}" alt="" loading="lazy" decoding="async" />
          </figure>
        {{ end }}

        <div class="article__body stack stack--4">
          {{ .Content }}
        </div>

      </article>

      {{ partial "side-matter.html" . }}
    </div>

  </div>
</section>
{{ end }}
